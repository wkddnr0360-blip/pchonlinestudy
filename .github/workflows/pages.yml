name: Verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
      PAGES_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        id: pages
      - name: Set the build path from GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: printf 'PAGES_BASE=%s/\n' "$PAGES_BASE_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:book
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and verify temporary public preview
        if: env.PAGES_PREVIEW == '1'
        env:
          VITE_PUBLIC_PREVIEW: "1"
        run: |
          npm run build
          npm run test:e2e -- tests/public-preview.e2e.ts
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the site serves HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [[ "$PAGE_URL" != https://* ]]; then
            echo '::error::GitHub Pages did not report an HTTPS URL.'
            exit 1
          fi

          final_url=$(curl --fail --silent --show-error --location \
            --proto-redir '=https' --max-redirs 5 \
            --retry 5 --retry-all-errors --retry-max-time 60 --max-time 15 \
            --output /dev/null --write-out '%{url_effective}' \
            "http://${PAGE_URL#https://}")

          if [[ "${final_url%/}" != "${PAGE_URL%/}" ]]; then
            printf '::error::Expected HTTP to redirect to %s, got %s\n' "$PAGE_URL" "$final_url"
            exit 1
          fi
